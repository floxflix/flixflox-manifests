apiVersion: v1
kind: Secret
metadata:
  name: flixflox-telegram-bot
type: Opaque
stringData:
  FLIXFLOX_BOT_TOKEN: "<token>"
  FLIXFLOX_ALLOWED_USER_IDS: "<user_id>"
  FLIXFLOX_DOWNLOAD_DIR: "/app/videos"
  FLIXFLOX_TELEGRAM_DATA_DIR: "/var/lib/telegram-bot-api"
  FLIXFLOX_TELEGRAM_SERVER_WORK_DIR: "/var/lib/telegram-bot-api"
  FLIXFLOX_TELEGRAM_API_ENDPOINT: "http://flixflox-telegram-api/bot%s/%s"
  FLIXFLOX_TELEGRAM_FILE_ENDPOINT: "http://flixflox-telegram-api/file/bot%s/%s"
  FLIXFLOX_API_URL: "http://flixflox"
