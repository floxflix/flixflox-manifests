apiVersion: apps/v1
kind: Deployment
metadata:
  name: floxflix-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: floxflix-ui
  template:
    metadata:
      labels:
        app: floxflix-ui
    spec:
      containers:
        - name:  floxflix-ui
          image: elvus/floxflix-ui:1.2.1
          imagePullPolicy: Always
          envFrom:
            - configMapRef:
                name: floxflix-ui-env
          ports:
            - containerPort: 80
