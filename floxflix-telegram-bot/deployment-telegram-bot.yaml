apiVersion: apps/v1
kind: Deployment
metadata:
  name: floxflix-telegram-bot
  labels:
    app: floxflix-telegram-bot
    version: v1
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: floxflix-telegram-bot
      version: v1
  template:
    metadata:
      labels:
        app: floxflix-telegram-bot
        version: v1
    spec:
      securityContext:
        runAsUser: 101
        runAsGroup: 101
      containers:
        - name: floxflix-telegram-bot
          image: elvus/floxflix-telegram-bot:1.0.1
          imagePullPolicy: Always
          envFrom:
            - secretRef:
                name: floxflix-telegram-bot
          volumeMounts:
            - name: videos
              mountPath: /app/videos
            - name: telegram-data
              mountPath: /var/lib/telegram-bot-api
      volumes:
        - name: videos
          persistentVolumeClaim:
            claimName: videos-pvc
        - name: telegram-data
          persistentVolumeClaim:
            claimName: telegram-data
