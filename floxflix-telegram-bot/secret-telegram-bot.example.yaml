apiVersion: v1
kind: Secret
metadata:
  name: floxflix-telegram-bot
type: Opaque
stringData:
  FLOXFLIX_BOT_TOKEN: "<token>"
  FLOXFLIX_ALLOWED_USER_IDS: "<user_id>"
  FLOXFLIX_DOWNLOAD_DIR: "/app/videos"
  FLOXFLIX_TELEGRAM_DATA_DIR: "/var/lib/telegram-bot-api"
  FLOXFLIX_TELEGRAM_SERVER_WORK_DIR: "/var/lib/telegram-bot-api"
  FLOXFLIX_TELEGRAM_API_ENDPOINT: "http://floxflix-telegram-api/bot%s/%s"
  FLOXFLIX_TELEGRAM_FILE_ENDPOINT: "http://floxflix-telegram-api/file/bot%s/%s"
  FLOXFLIX_API_URL: "http://floxflix"
