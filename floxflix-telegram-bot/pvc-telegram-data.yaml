apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: telegram-data
  labels:
    app.kubernetes.io/name: floxflix-telegram-bot
    app.kubernetes.io/component: telegram-bot-api
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi