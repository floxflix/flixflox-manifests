apiVersion: apps/v1
kind: Deployment
metadata:
  name: floxflix
  labels:
    app: floxflix
    version: v1
spec:
  replicas: 1
  revisionHistoryLimit: 0
  selector:
    matchLabels:
      app: floxflix
      version: v1
  template:
    metadata:
      labels:
        app: floxflix
        version: v1
    spec:
      containers:
        - name: floxflix
          image: elvus/floxflix:2.0.1
          imagePullPolicy: Always
          ports:
            - containerPort: 7777
          livenessProbe:
            httpGet:
              path: /healthz
              port: 7777
          env:
            - name: UPLOAD_FOLDER
              value: videos/
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: floxflix-secret
                  key: JWT_SECRET_KEY
            - name: MONGO_URI
              valueFrom:
                secretKeyRef:
                  name: floxflix-secret
                  key: MONGO_CONNECTION_STRING
            - name: CORS_ORIGIN
              value: "http://floxflix.lan"
            - name: PORT
              value: "7777"
          resources:
            requests:
              cpu: 100m
              memory: 100Mi
          volumeMounts:
            - name: videos
              mountPath: /app/videos
      volumes:
        - name: videos
          persistentVolumeClaim:
            claimName: videos-pvc
